<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">AgentStudio conceptual architecture</title>
  <desc id="desc">User-approved input flows through a local agent orchestrator, to local or opt-in cloud models, private memory, scoped tools and verification gates.</desc>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8z" fill="#6d8bb7"/></marker>
  </defs>
  <rect width="1200" height="430" rx="26" fill="#f4f7ff"/>
  <text x="42" y="46" fill="#0f294e" font-size="25" font-family="Arial, sans-serif" font-weight="700">AgentStudio · Controlled local agent workflow</text>
  <text x="42" y="75" fill="#527095" font-size="15" font-family="Arial, sans-serif">Architecture illustration based on implemented modules · not a screenshot</text>
  <rect x="40" y="130" width="200" height="160" rx="20" fill="#e6eeff" stroke="#8eaddd"/>
  <text x="140" y="177" text-anchor="middle" fill="#173d72" font-family="Arial,sans-serif" font-weight="700" font-size="21">User task</text>
  <text x="140" y="210" text-anchor="middle" fill="#4f6991" font-family="Arial,sans-serif" font-size="15">Explicit scope</text>
  <text x="140" y="235" text-anchor="middle" fill="#4f6991" font-family="Arial,sans-serif" font-size="15">and approval</text>
  <path d="M240 208 H294" stroke="#6d8bb7" stroke-width="3" fill="none" marker-end="url(#arr)"/>
  <rect x="300" y="130" width="240" height="160" rx="20" fill="#173e73"/>
  <text x="420" y="177" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-weight="700" font-size="21">Agent orchestration</text>
  <text x="420" y="210" text-anchor="middle" fill="#d3e4ff" font-family="Arial,sans-serif" font-size="15">DSH / custom Skills</text>
  <text x="420" y="235" text-anchor="middle" fill="#d3e4ff" font-family="Arial,sans-serif" font-size="15">Tool permissions</text>
  <path d="M540 185 H600" stroke="#6d8bb7" stroke-width="3" fill="none" marker-end="url(#arr)"/>
  <rect x="608" y="105" width="245" height="100" rx="18" fill="#e6f8f1" stroke="#7bc5a9"/>
  <text x="730" y="141" text-anchor="middle" fill="#126e59" font-family="Arial,sans-serif" font-size="19" font-weight="700">Model routing</text>
  <text x="730" y="168" text-anchor="middle" fill="#2a7568" font-family="Arial,sans-serif" font-size="14">Local Qwen · opt-in API</text>
  <path d="M730 205 V238" stroke="#6d8bb7" stroke-width="3" fill="none" marker-end="url(#arr)"/>
  <rect x="608" y="245" width="245" height="105" rx="18" fill="#fff" stroke="#b7c8de"/>
  <text x="730" y="283" text-anchor="middle" fill="#264a78" font-family="Arial,sans-serif" font-size="19" font-weight="700">Private context</text>
  <text x="730" y="310" text-anchor="middle" fill="#547191" font-family="Arial,sans-serif" font-size="14">Encrypted local memory</text>
  <path d="M853 205 H905" stroke="#6d8bb7" stroke-width="3" fill="none" marker-end="url(#arr)"/>
  <rect x="910" y="130" width="248" height="160" rx="20" fill="#fff7ec" stroke="#e6b16e"/>
  <text x="1034" y="177" text-anchor="middle" fill="#885125" font-family="Arial,sans-serif" font-size="20" font-weight="700">Tools + verification</text>
  <text x="1034" y="208" text-anchor="middle" fill="#896745" font-family="Arial,sans-serif" font-size="14">MCP / browser / local files</text>
  <text x="1034" y="236" text-anchor="middle" fill="#896745" font-family="Arial,sans-serif" font-size="14">Evidence / review gates</text>
  <rect x="40" y="382" width="1118" height="24" rx="8" fill="#dde9f8"/>
  <text x="600" y="399" text-anchor="middle" fill="#506e95" font-family="Arial,sans-serif" font-size="13">Privacy boundary: no unrestricted file reads or automatic third-party submission in public demos</text>
</svg>